# Checks every push the way a person with a Mac would: the backend's tests, a
# real Xcode build of the iPhone app on the oldest and newest toolchains we
# support, a photograph of every screen, in every language, from the
# simulator — and the app itself, run against a real server with nobody
# touching it, doing what its owner would do.
name: CI

on:
  push:
    branches-ignore:
      # Holds only the screenshots this workflow itself produces.
      - ci-screenshots
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm test
        working-directory: backend
      - name: Every string in the app is translated
        run: python3 ios/scripts/check-strings.py

  ios:
    name: iOS build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      # The newest leg pushes its screenshots to the ci-screenshots branch.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The deployment target is iOS 18, so the app has to build with the
          # iOS 18 SDK as well as with the current one.
          - name: Xcode 16, iOS 18 SDK
            os: macos-15
            screenshots: false
          - name: Xcode 26, iOS 26 SDK
            os: macos-26
            screenshots: true
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Check the string files
        working-directory: ios
        run: |
          for file in AISecretary/*.lproj/*.strings; do plutil -lint "$file"; done

      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project AISecretary.xcodeproj \
            -scheme AISecretary \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | xcbeautify --quiet --renderer github-actions

      - name: Summarise compiler errors
        if: failure()
        run: |
          echo "=== COMPILER ERRORS ==="
          grep -E "error:" "$RUNNER_TEMP/build.log" | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -120 || true
          echo "=== END ==="

      - name: Photograph every screen
        if: matrix.screenshots
        # A simulator that will not start must not hold the build up for hours.
        timeout-minutes: 25
        run: |
          ios/scripts/screenshots.sh \
            "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/AISecretary.app" \
            "$RUNNER_TEMP/screens"

      - uses: actions/setup-node@v4
        if: matrix.screenshots
        with:
          node-version: 22

      # The server is started on this machine and the app is let loose on it:
      # it has to find the server on the network, place a call and follow it
      # line by line, hang up, take an answered call, and get past a server
      # that asks for its key. See ios/scripts/selftest.sh.
      - name: Run the app against a real server
        if: matrix.screenshots
        timeout-minutes: 15
        run: |
          (cd backend && npm ci --no-audit --no-fund)
          ios/scripts/selftest.sh \
            "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/AISecretary.app" \
            "$GITHUB_WORKSPACE/backend" \
            "$RUNNER_TEMP/screens/selftest"

      # The pictures go to their own branch — nothing but pictures, replaced on
      # every run — so they can be looked at without downloading anything.
      # Published also when the run above failed: its pictures show why.
      - name: Publish the screenshots
        if: ${{ !cancelled() && matrix.screenshots }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [ -d "$RUNNER_TEMP/screens" ] || exit 0
          cd "$RUNNER_TEMP/screens"
          printf '# Screenshots\n\nEvery screen of the app as built from `%s` (%s), in English, German and Turkish.\nProduced by the CI workflow; replaced on every run.\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > README.md
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots of $GITHUB_SHA"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Keep the full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
