# XcodeGen project definition.
# Install XcodeGen (brew install xcodegen), then run ./generate.sh in this
# directory to produce AISecretary.xcodeproj.
#
# The target and bundle identifier keep the project's first name so an
# installed copy updates in place; the app itself is called Yaver.
name: AISecretary
options:
  bundleIdPrefix: com.example
  # iOS 18+ is required by the Translation framework (on-device translator).
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
targets:
  AISecretary:
    type: application
    platform: iOS
    sources:
      - AISecretary
    # Signing team and other per-machine settings live in Config/Local.xcconfig,
    # which is not checked in, so regenerating the project does not lose them.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: AISecretary/Info.plist
      properties:
        CFBundleDisplayName: Yaver
        # The version people see, and the build number App Store Connect
        # counts: both come from the build settings below, so that Xcode can
        # raise the build number by itself when it uploads.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        # The interface follows the iPhone's language: English, German, Turkish.
        CFBundleLocalizations:
          - en
          - de
          - tr
        # Paper ground with the mark, until the first screen is up.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The Modernist design system is a single light ground — there is no
        # dark palette for the app to switch to.
        UIUserInterfaceStyle: Light
        # Archivo, the one family in the design system (SIL OFL — see
        # AISecretary/Resources/Fonts/OFL.txt).
        UIAppFonts:
          - Archivo-Regular.ttf
          - Archivo-SemiBold.ttf
          - Archivo-ExtraBold.ttf
        # yaver://pair?url=…&key=… — opened by the server's pairing page, so
        # the server's address never has to be typed.
        CFBundleURLTypes:
          - CFBundleURLName: com.canonur.aisecretary.pair
            CFBundleURLSchemes:
              - yaver
        # Allows plain-HTTP calls to localhost / LAN addresses: the server
        # usually runs on a computer at home. Addresses on the internet still
        # need HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The server is found on the home network (Bonjour) and reached there.
        # iOS asks the user's permission for both, with this sentence.
        NSLocalNetworkUsageDescription: >-
          Yaver finds and talks to its server on your computer, so it needs to
          use your local network.
        NSBonjourServices:
          - _yaver._tcp
        # Live translator permissions
        NSMicrophoneUsageDescription: >-
          The microphone is used by the live translator so what is said can be
          written down and translated.
        NSSpeechRecognitionUsageDescription: >-
          Speech recognition turns what you and the person you are talking to
          say into text so it can be translated.
        # Letters and forms: the camera photographs the document, the text is
        # read on the device, and only that text is sent to the secretary.
        NSCameraUsageDescription: >-
          The camera photographs a letter or form so Yaver can read it.
          Only the text is sent — the photograph stays on your phone.
        NSPhotoLibraryUsageDescription: >-
          Pick a photo of a letter or form so Yaver can read it. Only
          the text is sent — the photograph stays on your phone.
        # The app talks to its server over HTTPS (or plain HTTP at home) and
        # does no encryption of its own: no export documents are needed, and
        # App Store Connect does not have to ask about it with every upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # Must be unique across the App Store — com.example.* is a placeholder
        # that is already claimed, and Apple will refuse to sign against it.
        PRODUCT_BUNDLE_IDENTIFIER: com.canonur.aisecretary
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Extract nothing automatically: the app's strings are looked up by
        # hand (see Support/L10n.swift) and checked by scripts/check-strings.py.
        SWIFT_EMIT_LOC_STRINGS: "NO"
# A shared scheme, so `xcodebuild -scheme AISecretary` works from the command
# line (CI) and Xcode shows the same one.
schemes:
  AISecretary:
    build:
      targets:
        AISecretary: all
    run:
      config: Debug
    archive:
      config: Release
