# XcodeGen project definition.
# Install XcodeGen (brew install xcodegen), then run `xcodegen generate`
# in this directory to produce AISecretary.xcodeproj.
name: AISecretary
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  AISecretary:
    type: application
    platform: iOS
    sources:
      - AISecretary
    info:
      path: AISecretary/Info.plist
      properties:
        CFBundleDisplayName: AI Secretary
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Allows plain-HTTP calls to localhost / LAN IPs during development.
        # Remove for production (use HTTPS).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aisecretary
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
