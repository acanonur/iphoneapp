# XcodeGen project definition.
# Install XcodeGen (brew install xcodegen), then run `xcodegen generate`
# in this directory to produce AISecretary.xcodeproj.
name: AISecretary
options:
  bundleIdPrefix: com.example
  # iOS 18+ is required by the Translation framework (on-device translator).
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
targets:
  AISecretary:
    type: application
    platform: iOS
    sources:
      - AISecretary
    info:
      path: AISecretary/Info.plist
      properties:
        CFBundleDisplayName: AI Secretary
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The Modernist design system is a single light ground — there is no
        # dark palette for the app to switch to.
        UIUserInterfaceStyle: Light
        # Archivo, the one family in the design system (SIL OFL — see
        # AISecretary/Resources/Fonts/OFL.txt).
        UIAppFonts:
          - Archivo-Regular.ttf
          - Archivo-SemiBold.ttf
          - Archivo-ExtraBold.ttf
        # Allows plain-HTTP calls to localhost / LAN IPs during development.
        # Remove for production (use HTTPS).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # On a real device the backend is reached at the developer Mac's LAN
        # address, and since iOS 14 that needs the user's permission. Without
        # this string the request is refused before it is ever made.
        NSLocalNetworkUsageDescription: >-
          The app talks to the secretary backend running on your computer, so it
          needs to reach it over your local network.
        # Live translator permissions
        NSMicrophoneUsageDescription: >-
          The microphone is used by the live translator so what is said can be
          transcribed and translated.
        NSSpeechRecognitionUsageDescription: >-
          Speech recognition turns what you and your conversation partner say
          into text so it can be translated.
        # Letters and forms: the camera photographs the document, the text is
        # read on the device, and only that text is sent to the secretary.
        NSCameraUsageDescription: >-
          The camera photographs a letter or form so the secretary can read it.
          Only the text is sent — the photograph stays on your phone.
        NSPhotoLibraryUsageDescription: >-
          Pick a photo of a letter or form so the secretary can read it. Only
          the text is sent — the photograph stays on your phone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aisecretary
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
