# XcodeGen project definition for KnitStudio.
#
# Requires XcodeGen 2.35+ (for `supportedDestinations`) and Xcode 15+.
#   brew install xcodegen
#   cd ios-knitstudio && xcodegen generate && open KnitStudio.xcodeproj
#
# One target, three destinations: iPhone, iPad and Mac. Not Mac Catalyst —
# this is a native macOS build of the same SwiftUI code.
name: KnitStudio
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

targets:
  KnitStudio:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - KnitStudio
    info:
      path: KnitStudio/Info.plist
      properties:
        CFBundleDisplayName: KnitStudio
        LSApplicationCategoryType: public.app-category.lifestyle
        # iOS-only keys; macOS ignores them.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Needed on both platforms to import a picture as a colourwork chart.
        NSPhotoLibraryUsageDescription: >-
          Choose a picture to turn into a knitting chart. Images stay on your
          device — nothing is uploaded.
    entitlements:
      path: KnitStudio/KnitStudio.entitlements
      properties:
        # macOS App Sandbox. The app has no network access at all; the only
        # capability it needs is reading a pattern file the user picked.
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.knitstudio
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        # iPhone and iPad. Ignored by the macOS destination.
        TARGETED_DEVICE_FAMILY: "1,2"
        # Native macOS, not Mac Catalyst.
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ENABLE_HARDENED_RUNTIME: YES

  KnitStudioTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - KnitStudioTests
    dependencies:
      - target: KnitStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.knitstudio.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KnitStudio:
    build:
      targets:
        KnitStudio: all
        KnitStudioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - KnitStudioTests
