# XcodeGen project definition for KnitStudio.
#
# KnitStudio.xcodeproj is GENERATED and is not in git, so it has to be rebuilt
# after every pull that adds a source file — otherwise Xcode compiles the old
# file list and reports the new types as "cannot find in scope":
#
#   brew install xcodegen          # 2.35 or newer
#   cd ios-knitstudio && xcodegen generate && open KnitStudio.xcodeproj
#
# MAC ONLY FOR NOW. The code is written for iOS as well and nothing in it is
# Mac-specific outside KnitStudio/Platform/PlatformCompat.swift; iPhone and iPad
# come back by putting iOS into BOTH supportedDestinations lists below. They are
# left out while the Mac build is being finished because a shared target makes
# Xcode resolve an iOS provisioning profile on every build, which fails on a
# personal team with no registered device.
name: KnitStudio
options:
  bundleIdPrefix: com.acanonur
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

targets:
  KnitStudio:
    type: application
    # Add iOS back here (and in the test target) to build for iPhone and iPad.
    supportedDestinations: [macOS]
    sources:
      - KnitStudio
    info:
      path: KnitStudio/Info.plist
      properties:
        CFBundleDisplayName: KnitStudio
        LSApplicationCategoryType: public.app-category.lifestyle
        # Needed on both platforms to import a picture as a colourwork chart.
        NSPhotoLibraryUsageDescription: >-
          Choose a picture to turn into a knitting chart. Images stay on your
          device — nothing is uploaded.
    entitlements:
      path: KnitStudio/KnitStudio.entitlements
      properties:
        # macOS App Sandbox. The app has no network access at all; the only
        # capability it needs is reading a pattern file the user picked.
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acanonur.knitstudio
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        # Native macOS, not Mac Catalyst. Put TARGETED_DEVICE_FAMILY: "1,2"
        # back alongside this when iOS returns to supportedDestinations.
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  KnitStudioTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - KnitStudioTests
    dependencies:
      - target: KnitStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acanonur.knitstudio.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KnitStudio:
    build:
      targets:
        KnitStudio: all
        KnitStudioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - KnitStudioTests
