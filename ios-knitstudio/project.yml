# XcodeGen project definition for KnitStudio.
# Install XcodeGen (brew install xcodegen), then run `xcodegen generate`
# in this directory to produce KnitStudio.xcodeproj.
name: KnitStudio
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  KnitStudio:
    type: application
    platform: iOS
    sources:
      - KnitStudio
    info:
      path: KnitStudio/Info.plist
      properties:
        CFBundleDisplayName: KnitStudio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Importing a picture to turn into a colourwork chart.
        NSPhotoLibraryUsageDescription: >-
          Choose a picture to turn into a knitting chart. Images stay on your
          device — nothing is uploaded.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.knitstudio
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  KnitStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KnitStudioTests
    dependencies:
      - target: KnitStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.knitstudio.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KnitStudio:
    build:
      targets:
        KnitStudio: all
        KnitStudioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - KnitStudioTests
